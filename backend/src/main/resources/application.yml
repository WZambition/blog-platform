server:
  port: 8080

spring:
  application:
    name: blog-platform
  datasource:
    url: jdbc:mysql://localhost:3306/blog_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: blog
    password: Blog@2026
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# 自定义配置
blog:
  # 上传文件存储目录（相对项目运行目录）
  upload-dir: ./uploads
